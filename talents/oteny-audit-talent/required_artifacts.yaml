# Host Talent readiness. The project binds the Odoo uplink. This
# bundle only needs the RPC tool mounted and oteny_audit installed there.
bot: oteny-audit-talent
base_language: en

artifacts:
  - kind: tools
    required:
      - odoo_client
    stubbed: []

  - kind: cron
    jobs_path: ~/.hermes/cron/jobs.json
    jobs: []
